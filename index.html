<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Tansley Tales</title>
<meta name="description" content="Stories for children, with a dyslexia-friendly version of every story.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a night-sky masthead over a warm paper reading area; one column, story text held to a short line. */
:root{
  --night:#16213f;        /* masthead sky, from the banner */
  --night-2:#223063;
  --gold:#f3c969;         /* storybook glow */
  --cream:#fbf6ea;        /* page background */
  --paper:#fffdf7;        /* cards and reading sheet */
  --ink:#27263a;          /* body text, softer than black */
  --muted:#5f5d74;
  --lavender:#d9cdef;
  --peach:#f5cdb6;
  --line:#e7dfcc;
  --focus:#7a5cc4;
  --dys-bg:#fdf5e1;       /* dyslexia mode reading sheet */
  --shout:#8f5a00;        /* loud words (ROOOAAAR!, WHOOSH!), the gold of the print book made dark enough to read */
  --pic-paper:#faf3e1;    /* the cream paper the pictures are painted on; the same in both themes */
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Verdana",system-ui,sans-serif;
  --step-0:1.05rem; --step-1:1.3rem; --step-2:1.7rem; --step-3:2.4rem;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --cream:#131a33; --paper:#1b2446; --ink:#f1ecdf; --muted:#b9b4cc; --line:#2f3a66;
  --lavender:#3b3570; --peach:#5a3d3a; --dys-bg:#241f1a; --focus:#c8b6ff; --shout:#f3c969; color-scheme:dark }}
:root[data-theme="dark"]{
  --cream:#131a33; --paper:#1b2446; --ink:#f1ecdf; --muted:#b9b4cc; --line:#2f3a66;
  --lavender:#3b3570; --peach:#5a3d3a; --dys-bg:#241f1a; --focus:#c8b6ff; --shout:#f3c969; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--font-body);font-size:var(--step-0);line-height:1.7;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}

/* masthead */
.sky{background:radial-gradient(120% 90% at 50% 110%,#3a3a78 0%,var(--night-2) 45%,var(--night) 100%);color:#fbf1d6;position:relative;overflow:hidden}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bar{position:relative;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:18px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-size:1.5rem;font-weight:600;color:var(--gold)}
.brand img{display:block;width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px rgba(243,201,105,.55)}  /* the Tansley Tales picture, the same one as the YouTube channel */
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{text-decoration:none;padding:8px 14px;border-radius:999px;font-size:1rem;color:#efe8d6}
nav a[aria-current="page"]{background:rgba(243,201,105,.18);color:var(--gold)}
.hero{position:relative;max-width:1080px;margin:0 auto;padding:28px 20px 56px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px 40px}
.hero-text{display:grid;gap:18px;min-width:0}
.hero-pic{display:block;width:clamp(170px,22vw,250px);height:auto;aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:0 0 0 4px rgba(243,201,105,.4),0 0 70px rgba(243,201,105,.28)}
@media (max-width:700px){ .hero{grid-template-columns:minmax(0,1fr)} .hero-pic{display:none} }  /* on phones the picture is already in the top bar */
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);color:#fff4d4}
.hero p{max-width:34ch;font-size:var(--step-1);color:#e6dfcf;margin:0;font-weight:300}
.hero .cta{justify-self:start}

.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;border:0;cursor:pointer;text-decoration:none;border-radius:999px;padding:12px 22px;background:var(--gold);color:#241c05}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[aria-pressed="true"]{background:var(--lavender);color:var(--ink);border-color:transparent}
.btn[disabled]{opacity:.4;cursor:default}

main{max-width:1080px;margin:0 auto;padding:40px 20px 72px;display:grid;gap:48px}
.section-head{display:grid;gap:6px}
.section-head h2{font-size:var(--step-2)}
.section-head p{margin:0;color:var(--muted)}

/* shelves */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.book{display:grid;grid-template-rows:auto 1fr;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;min-width:0}
.cover{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;font-family:var(--font-display);font-size:1.25rem;text-align:center;padding:16px;color:#2a2440}
.cover.has-img{padding:0;background:var(--pic-paper)}
.cover.has-img img{display:block;width:100%;height:100%;object-fit:cover}
.book .info{padding:14px 16px 18px;display:grid;gap:6px;align-content:start}
.book h3{font-size:1.2rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;color:var(--muted)}
.tag{background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.soon{font-size:.85rem;font-weight:600;color:var(--muted)}
.book[href]:hover .cover{filter:brightness(1.05)}
.book:not([href]){opacity:.82}

.promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.promise div{display:grid;gap:4px}
.promise h3{font-size:1.15rem}
.promise p{margin:0;color:var(--muted)}

/* reader */
.reader{display:grid;gap:24px}
.reader-head{display:grid;gap:10px}
.reader-head h1{font-size:var(--step-3)}
/* the credit under a story title: brand line, who made and reads it, and the plain AI line (credit policy, 9 Oct 2026) */
.credit{margin:0;display:grid;gap:2px;max-width:48ch}
.credit strong{font-weight:600;font-size:.95rem;letter-spacing:.03em;color:var(--muted)}
.credit small{font-size:.95rem;color:var(--muted)}
.dedication{margin:0;display:grid;gap:2px;max-width:48ch}
.dedication span{color:var(--muted);font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.controls .label{font-size:.9rem;color:var(--muted);margin-right:4px}
.narration{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.95rem;color:var(--muted)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,48px)}
.story{max-width:62ch;margin:0 auto;display:grid;gap:1.6em}
.story p{margin:0}
.story .rhyme{font-style:italic;color:var(--muted)}
.story .moral{font-family:var(--font-display);font-size:var(--step-1);color:var(--ink)}
.story .end{text-align:center;font-family:var(--font-display);color:var(--muted)}
.story section{display:grid;gap:.5em}
.story .chapter{font-size:var(--step-2);display:grid;gap:.1em;margin-bottom:.2em}
.story .chapter span{font-family:var(--font-body);font-size:.95rem;font-weight:600;letter-spacing:.04em;color:var(--shout)}
.story .brk{height:.55em}
.story .prompt{justify-self:start;font-weight:600;background:#f6e3a8;color:#2a2440;border-radius:14px;padding:.3em .9em}   /* "Can you count them?" and "Your turn" boxes, like the gold box in the book */
.read-way .btn[aria-current="true"]{background:var(--lavender);color:var(--ink);border-color:transparent}
.story .shout{font-family:var(--font-display);font-weight:600;font-size:1.5em;line-height:1.2;color:var(--shout)}
/* pages after the story: the lesson, thank-you words, recipes */
.story.extra{gap:1.1em}
.story.extra h2{font-size:var(--step-2)}
.story.extra .lead-in{color:var(--muted)}
.thanks{margin:0;display:grid;gap:.9em}
.thanks div{display:grid;gap:.1em}
.thanks dt{font-weight:600}
.thanks dt span{font-weight:400;color:var(--muted)}
.thanks dd{margin:0}
.recipe{padding-top:1.1em;border-top:1px solid var(--line)}
.recipe h3{font-size:var(--step-1)}
.recipe ol{margin:0;padding-left:1.5em;display:grid;gap:.45em}
.recipe strong{font-weight:600}

/* picture-book mode: one picture and its words per screen, with Back and Next */
.pb{display:grid;gap:clamp(16px,3vw,28px);padding:clamp(14px,3vw,32px)}
.pb figure{margin:0 auto;aspect-ratio:1200/670;width:min(100%,calc(56vh * 1200 / 670));max-width:100%;background:var(--pic-paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}  /* capped so the picture, words and buttons fit on one screen */
.pb figure img{display:block;width:100%;height:100%;object-fit:cover}
/* blended pictures (blend:true): no box. The picture fades into cream, so the reading sheet is the same cream (light theme) */
.pb.blend figure{border:0;border-radius:0;background:transparent}
:root:not([data-theme="dark"]) .pb.blend{background:var(--pic-paper)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pb.blend{background:var(--paper)} :root:not([data-theme="light"]) .pb.blend figure{border-radius:28px;background:var(--pic-paper)} }
:root[data-theme="dark"] .pb.blend figure{border-radius:28px;background:var(--pic-paper)}
.pb .story{width:100%;max-width:46ch;gap:.7em;font-size:var(--step-1);line-height:1.75;min-height:7.5em;align-content:start}
.pb .story .moral{font-size:1.45rem}
.pb .story:has(.brk){gap:.35em}   /* chapter books: lines sit close, groups of lines sit apart */
.dys .pb .story:has(.brk){gap:.5em}
.dys .story .brk{height:.9em}
.pb .story .end{font-size:var(--step-2);color:var(--ink);text-align:left}
.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.pager .btn{min-height:52px;padding:12px 26px;font-size:1.1rem}
.pager .back{justify-self:start}
.pager .next{justify-self:end}
.pager .count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums;text-align:center}
.track{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.track div{height:100%;width:0;background:var(--gold);border-radius:999px;transition:width .25s ease}
.after{margin:0;color:var(--muted)}
@media (max-width:520px){
  .pager{grid-template-columns:1fr 1fr}
  .pager .count{grid-column:1/-1;grid-row:1}
  .pager .btn{padding:12px 16px;justify-content:center;width:100%}
}

/* dyslexia-friendly mode */
.dys .sheet{background:var(--dys-bg)}
.dys .story{max-width:48ch;gap:2.2em;font-size:1.25rem;line-height:2;letter-spacing:.06em;word-spacing:.18em}
.dys .story .rhyme{font-style:normal;font-weight:600}
.dys .story p{text-align:left}
.dys .pb .story{max-width:40ch;gap:1em;font-size:1.45rem;line-height:2.1}

.prose{max-width:62ch;display:grid;gap:1em}
.prose p{margin:0}
.note{background:var(--peach);border-radius:12px;padding:14px 16px;color:var(--ink)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .inner{max-width:1080px;margin:0 auto;padding:24px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

</head>

const STORIES = [

/* Story text. "~" = rhyme line, "^" = a loud word, "!" = closing message, "#" = The End, "@" = chapter heading, "" = small space */
const TEXT = { milo: [
 ["In the middle of Willow Wood, where the willow trees whisper and the stream runs slow, there lived a tiny mouse called Milo.","Milo was small.","Milo was quiet.","And Milo had a secret."],
 ["Every morning, when the wood was still yawning, Milo crept down to the sandy bank by the stream.","He picked up his favourite twig and began to draw.","~Scritch, scratch, swish and sway,","~Milo drew his worries away.","He drew moons and mountains. He drew fish with fancy fins. He drew a bear wearing a very small hat.","But whenever a leaf rustled or a twig snapped, Milo dashed behind a stone and hid."],
 ["One day, a poster went up on the Big Oak Tree.","THE BIG TALENT SHOW! Saturday. Moonrise. Everyone welcome!","The whole wood was buzzing.","Squirrel practised juggling acorns. (Bonk! Sorry, Badger!)","Frog practised singing. (Mostly burping.)","The Rabbit twins practised a dance that went hop, hop, flop.","Everyone was excited. Everyone except Milo.","“I’m too small to be seen,” he whispered. “And too quiet to be heard.”"],
 ["The next morning, Milo was drawing a starry sky when a voice said,","“OH. MY. GOODNESS!”","Milo nearly jumped out of his whiskers.","It was Luna the Ladybird, spotty and bright, and she did not stop talking.","“Did you draw this? You did! You drew this! It’s the most wonderful thing I’ve ever seen, and I’ve seen a LOT of things, because I fly, you know, and flying means seeing, and seeing means...”","“Hoo,” said a soft voice from above. “Breathe, Luna.”","It was Ollie the Owl."],
 ["Ollie looked down at the drawings for a long, long time.","“Milo,” he said gently, “you have a gift.”","“You must show everyone at the Talent Show!” cried Luna. “You simply MUST!”","Milo’s ears drooped. His tail curled up tight.","“But what if they laugh?” he whispered.","“What if they don’t look?","What if I’m too small, too quiet, too... me?”"],
 ["Just then, someone arrived. Very slowly.","It was Toby the Tortoise.","“Sorry I’m late,” said Toby. “I set off on Tuesday.”","(It was Thursday.)","Toby looked at Milo’s worried face and smiled a slow, kind smile.","“Bravery doesn’t come all at once, little one,” he said.","“Slow and steady.","One small step.","Then you’re ready.”","Milo thought about that all night long.","~Scritch, scratch, swish and sway,","~Milo drew his worries away."],
 ["On Saturday, the wood looked magical.","The animals hung painted leaf banners between the branches. They strung up berry lanterns. They built a stage on the sandy clearing by the stream.","Milo watched from behind a mushroom.","“Maybe next year,” he told himself. “When I’m bigger. When I’m louder. When I’m braver.”"],
 ["Then the sky grew grey.","The wind began to howl.","And down came the rain.","~Pitter, patter.","~Splish, SPLASH.","~Crackle, rumble, CRASH!","The animals ran for cover. The banners flapped and tore. The lanterns rolled away. The paint washed off in wiggly, wobbly streams."],
 ["When the storm was over, everyone crept out.","The stage decorations were gone. Every single one.","“The show is ruined,” sniffed Rabbit.","“No banners,” sighed Badger.","“No lanterns,” groaned Squirrel.","“Ribbit,” said Frog, which meant, “I don’t mind, honestly.”","Milo looked at the clearing.","The rain had left the sand smooth, and flat, and shining.","Just like a brand new page."],
 ["Milo’s heart went thump, thump, thump.","He could hide. Hiding was easy.","Or he could help. Helping was hard.","He remembered Toby’s words.","~Slow and steady. One small step.","Milo took one small step out from behind the mushroom.","Then another.","Then another.","“I... I have an idea,” he squeaked.","Nobody heard."],
 ["“EVERYONE!” shouted Luna. “MILO HAS AN IDEA!”","Every head turned. Every eye looked at Milo.","His knees wobbled. His whiskers wobbled. Even his tail wobbled.","But he held up his twig and said, a little louder this time,","“I can draw the decorations. In the sand.”","Nobody laughed.","Ollie simply nodded. “Show us, Milo.”"],
 ["So Milo drew.","~Scritch, scratch, swish and sway,","~Milo drew the gloom away.","He drew a giant silver moon. He drew stars that swirled like snowflakes. He drew willow trees with long, curling branches all around the stage.","The animals helped. Squirrel pressed shiny acorns in for sparkle. Rabbit tucked in flower petals. Toby laid pebbles very carefully in a line. (It took quite a while.)","And when the real moon rose, the wet sand glittered like a sky full of stars."],
 ["“Ooooooh,” said everyone.","“Aaaaaah,” said everyone.","“Ribbit,” said Frog, which meant, “Wow.”","The show went on. Squirrel juggled (only one bonk). The Rabbit twins danced (only one flop). Frog sang (only three burps).","And at the very end, Ollie called out,","“And our final act... the artist who saved the show... MILO!”"],
 ["Milo stood in the middle of his moonlit drawing.","He was still small.","He was still quiet.","But everyone was cheering. For him.","Milo didn’t need to be big, or loud. He just needed to believe in what he could do."],
 ["That night, snuggled in his bed beneath the willow roots, Milo smiled a sleepy smile.","~Scritch, scratch, swish and sway,","~Milo dreamed his brave new day.","Because Milo knew something now, and so do you:","!Even the smallest voices can make a big difference.","#The End"]
],
/* Bramble and the First Frost. Approved 13 Oct 2026. 5 chapters, 44 screen pages, 18 pictures. */
"bramble-1": [
 ["@Chapter 1: The First Frost", "Bramble the red squirrel darted along the branches of the great oak tree, his fluffy tail flicking behind him like a banner in the cool morning air. He leapt from one branch to another with a soft thump, sending a few golden leaves spiralling down to the forest floor.", "It was the first time Bramble had noticed his breath making little clouds in the air. He stopped, sniffed, and shivered.", "“Cold,” he muttered, pulling his tail around his body like a scarf. “When did the air get so chilly?”"],
 ["Below him, the forest stretched wide and busy. The trees were losing their leaves, painting the ground in reds, oranges and yellows. A soft crunch rose up whenever a deer passed through the undergrowth. Somewhere in the distance, a woodpecker tapped at a hollow trunk.", "Autumn had been kind so far. There had been plenty of nuts to snack on, berries to nibble, and long afternoons of racing through the branches with the other squirrels. But this morning felt different. The wind bit at his ears, sharper than before, and the ground sparkled faintly with a silver frost.", "Bramble tilted his head, thoughtful. “It feels like the forest is changing. But why?”"],
 ["“Because it is, young Bramble,” came a deep voice from above.", "Startled, Bramble looked up to see Oakley the Owl perched high on a bare branch. Oakley was a tawny owl with feathers the colour of twilight and eyes as round as the moon. He always seemed to appear exactly when Bramble needed answers, whether Bramble liked it or not.", "“Oakley!” Bramble squeaked. “You scared me!”", "“I didn’t mean to,” Oakley said, blinking slowly. “But it is time you started paying attention. Winter waits for no one.”"],
 ["“Winter?” Bramble repeated. He’d heard the word before, of course. But in truth, he had never thought much about it. He liked running and playing far too much.", "Oakley nodded gravely. “The days are shorter, the nights colder. The frost is only the beginning. You must prepare.”", "“Prepare? For what?”", "“For the long, cold months ahead,” Oakley hooted. “Every creature in these woods must have a plan before the snow arrives. Some sleep through the cold. Some travel to warmer places. And some, like you, must gather enough food to last until spring.”"],
 ["Bramble’s ears twitched nervously. “Enough food? How much is enough?”", "“That depends on how hungry you’ll be,” Oakley said with a chuckle. “A squirrel like you needs plenty of nuts and seeds, hidden in clever places where the snow cannot find them.”", "Bramble’s eyes widened. He had been nibbling hazelnuts here and there, but he hadn’t thought about saving them. The idea of planning ahead made his whiskers twitch uncomfortably.", "“What if I don’t find enough?” he asked in a small voice."],
 ["“Then winter will be long indeed,” Oakley replied. He stretched his wings wide, casting a great shadow across the frosty ground. “But you are clever, Bramble. You’ll find your way.”", "Bramble swallowed hard. He wanted to feel brave, but instead, a small knot of worry began to form in his tummy. The forest looked different now. It looked less like a playground and more like a puzzle he needed to solve.", "Oakley gave him a final wise stare. “Watch the others, little one. Each animal knows how to prepare. Learn from them, and you’ll be ready.”"],
 ["And with a powerful sweep of his wings, Oakley lifted into the pale morning sky, leaving Bramble alone with his thoughts.", "Bramble sat still on the branch for a long while, staring at the mist that curled between the trees. Winter waits for no one. The words echoed in his head.", "Finally, he flicked his tail and puffed out his chest. “All right then. I’ll figure this out. I’ll watch, I’ll learn, and I’ll prepare.”", "The forest whispered around him, leaves tumbling like tiny dancers in the wind. Bramble took a deep breath of the crisp air. He didn’t know exactly what winter would bring, but he knew one thing for certain: his adventure had just begun."],
 ["@Chapter 2: Hazelnut Hunt", "The next morning, Bramble awoke to a world dusted in silver. Frost glittered on every branch and leaf, turning the forest into a sparkling kingdom. He stretched, yawned, and rubbed his sleepy eyes with his tiny paws.", "Then he remembered Oakley’s warning: Winter waits for no one."],
 ["With a determined flick of his tail, Bramble scurried down the trunk of his oak tree. “Right,” he said to himself. “Time to gather food! I’ll have so many nuts that I’ll never go hungry.”", "The forest floor was a treasure chest waiting to be opened. Acorns lay scattered under the oaks, beechnuts were tucked into the damp soil, and hazelnuts hid among the leaves. Bramble bounded happily between them, picking up the biggest ones he could find."],
 ["“Too small,” he muttered, tossing aside a shrivelled nut. “Too cracked,” he said, rejecting another. “Aha! Perfect!”", "He clutched a fat hazelnut to his chest, beaming. He dug a little hole under a root, buried the nut, and patted the soil neatly with his paws. “There! Safe and sound.”", "Pleased with himself, Bramble raced to the next tree, his paws crunching through frosted leaves. He found another nut, then another, and another. Soon he had several hiding spots dotted across the forest floor."],
 ["The trouble was, Bramble was easily distracted. A woodpecker tapped loudly nearby, and Bramble paused to watch. A pile of leaves swirled in the wind, and he jumped in just for fun. Before long, he was chasing his own tail, forgetting about the hazelnuts entirely.", "When his tummy rumbled, he remembered. He was supposed to be storing the nuts, not eating every other one.", "“Oh dear,” Bramble sighed, staring at the crumbs around his paws. “I was doing so well!”"],
 ["A faint squeak startled him. He pricked his ears and turned. From under a patch of brambles came two tiny faces with twitching whiskers and shiny black eyes.", "“Hello?” Bramble said, tilting his head.", "“Who are you talking to?” squeaked the smaller one.", "“To you, of course,” Bramble replied.", "Out stepped two field mice, their fur soft and brown. One was slightly larger and stood tall with a careful expression. The other was smaller, with twitchy whiskers and a nose that never stopped wiggling.", "“I’m Tansley,” said the larger one."],
 ["“And I’m Emsley!” the smaller one squeaked. “We were watching you bury nuts. You’re very noisy.”", "Bramble’s ears turned pink. “I’m, um, I’m new to this getting-ready-for-winter thing.”", "Tansley nodded wisely. “You’ll want to be quieter. Hungry birds might hear.” He glanced nervously at the sky, as if expecting a hawk at any moment.", "Emsley piped up, “We’re gathering seeds and grains! Come and see!”", "Curious, Bramble followed them to a hollow log tucked against the roots of a beech tree. Inside, the mice had carefully stored a pile of seeds, berries and tiny nuts."],
 ["“Wow,” Bramble breathed. “You’ve been busy.”", "Tansley puffed out his chest. “We have to be. Winter is long for mice. We don’t sleep through it like some animals. We stay awake, and if we don’t have enough food, well...” He trailed off, and Emsley shivered at the thought.", "Bramble nodded seriously. “Oakley said I need to gather lots, too. But it’s hard not to get distracted.”", "Emsley giggled. “You’ll get used to it! We make a game of it. We race to see who can carry the most seeds without dropping any!”"],
 ["“Or we hide them in tricky places,” Tansley added. “Like under moss or inside old nutshells. That way, if another animal finds one stash, we’ve got backups.”", "Bramble’s eyes lit up. “That’s clever!”", "The three of them spent the afternoon racing between trees, scooping up seeds and nuts, and hiding them in secret places. Emsley made up songs to help them remember where the stashes were. Tansley scolded Bramble whenever he stopped to play in the leaves, but his whiskers twitched with amusement all the same."],
 ["By the time the sun dipped low, the little trio had collected a fine supply. Bramble sat proudly on a log, his paws dusty and his tail full of leaves.", "“This is hard work,” he panted. “But it feels good. I’ll be ready for winter in no time!”", "Tansley gave him a steady look. “Remember, Bramble, winter is long. One good day won’t be enough.”", "Emsley nodded, her eyes wide. “We work every day until the snow comes!”"],
 ["Bramble’s determination wobbled just a little. Every day? That sounded exhausting. But he made himself smile. “Then I’ll keep going, too. I’ll be the best-prepared squirrel in the whole forest!”", "The mice squeaked encouragement and scurried back to their log. Bramble bounded up into the branches of his oak, his mind buzzing with new ideas.", "As night fell, the forest glittered under a blanket of frost. Bramble curled up in his nest, tired but proud. He was still learning, and still fumbling, but for the first time, he felt like he was really preparing."],
 ["@Chapter 3: A Spiky Secret", "Bramble woke the next morning to the sound of leaves crunching faintly nearby. The forest floor, frosted white, glittered in the sunlight that filtered through the bare branches. He scurried down the oak trunk, his claws scratching the bark, and pricked his ears.", "Shuffle. Shuffle. Snuffle.", "It wasn’t the quick scamper of Tansley and Emsley, nor the sharp tapping of a woodpecker. This was slower and heavier, like something pushing through a pile of twigs. Bramble followed the sound, his paws sinking into the chilly carpet of leaves, until he found a curious sight: a ball of brown prickles nestled under a tangle of brambles."],
 ["The ball twitched, sniffed, and let out a grumbly snort.", "“Hello?” Bramble called carefully.", "The prickly ball unfurled, and a small face appeared, with a pointed snout, beady black eyes and whiskers dusted with frost.", "“Oh!” Bramble gasped. “You’re... spiky!”", "The creature chuckled, showing tiny teeth. “Indeed I am. Hazel the Hedgehog, pleased to meet you.” She gave a polite dip of her head, sending a few leaves tumbling from her back. “And who are you, bushy-tail?”", "“I’m Bramble the squirrel,” he said proudly. “And I’m busy preparing for winter!”", "Hazel raised her eyebrows. “Are you, now? I’d say you’re mostly bouncing and babbling.”"],
 ["Bramble’s ears turned pink. “I’m trying,” he muttered. “Oakley told me winter is coming, and Tansley and Emsley showed me how they store seeds. But it all sounds like... a lot.”", "Hazel chuckled again, the sound rumbling in her chest. “Well, I suppose you could say I take the easy route. I don’t bother rushing about once the frost thickens.”", "Bramble blinked. “You don’t? But Oakley said we all have to prepare.”", "“Oh, I prepare,” Hazel said, waddling over to a patch of leaves. With her snout, she began nosing them into a neat pile. “But not the way you do. I eat. I eat as much as I can now. Worms, beetles, slugs, berries, you name it. I fill myself up, nice and round.” She patted her tummy proudly. “Then, when the cold truly bites, I curl up in a snug little nest and sleep until spring.”"],
 ["“Sleep?” Bramble squeaked. “All winter?”", "“All winter,” Hazel said with a dreamy sigh. “That’s called hibernation. My heartbeat slows right down, my body cools, and I hardly need any food at all.”", "Bramble stared at her in amazement. “That sounds amazing. No gathering nuts, no worrying, just... snoozing!”", "Hazel smirked. “Think you could manage it?”", "Bramble tried to imagine staying still for months and months. No racing up branches, no nibbling crunchy hazelnuts, no chasing Emsley in circles just for fun. His whiskers twitched. “I’d go nuts!”"],
 ["“Exactly,” Hazel said with a wink. “Hibernation isn’t for everyone. You squirrels are made for collecting and hiding food. We hedgehogs are made for fattening up and snoozing. Each creature has its own way.”", "Bramble thought about that as Hazel shuffled more leaves into her pile. The nest was getting quite large, round and soft, with bits of moss poking through.", "“Do you make more than one?” Bramble asked.", "“Always,” Hazel said. “Several nests, hidden in different places. If one gets too damp, or if a fox comes sniffing, I simply move to another. That way, I’m never without shelter.”", "“That’s clever,” Bramble said. “Maybe I could make more nests too. Not for sleeping the whole winter, but for staying warm when the snow comes.”"],
 ["Hazel’s eyes twinkled. “Now you’re thinking.”", "They spent a while working side by side. Hazel showed Bramble how to weave leaves and moss into layers to trap the warm air. Bramble practised building a small shelter under a log. His paws were clumsy compared to Hazel’s nose, but he was proud when his little pile looked almost like a nest.", "“Not bad,” Hazel said. “Though I’d add more moss. Keeping the warmth in is the key.”", "Bramble puffed out his chest. “I’ll keep practising. Maybe I’ll make a few backup nests, like you.”", "“That’s the spirit,” Hazel said, yawning widely. She curled back into her leaf pile, prickles sticking out like little spears. “You’ll need your energy. Winter doesn’t care if you’re tired.”"],
 ["Bramble nodded. “Thanks, Hazel. You’ve given me good ideas.”", "Hazel’s eyes were already closing. “Good luck, Bramble. And don’t wish you were me. Your path is yours. Mine is mine. And both can lead to spring.”", "Within moments, her snores joined the rustling of the leaves.", "Bramble stayed a little while, watching her rise and fall gently with each breath. He wished he could feel as calm and certain as she did, but her words gave him courage. He didn’t need to copy anyone exactly. He just needed to prepare in the way that suited him best.", "With a flick of his tail, Bramble bounded back into the trees. Above him, the sky was pale blue, streaked with wisps of cloud. The air smelled sharper and colder. But in his chest, he felt something new: determination."],
 ["@Chapter 4: Fern the Fox’s Clever Ways", "Bramble was practising burying hazelnuts when he first spotted her. The leaves shifted, the ferns quivered, and out stepped a sleek shape with fiery red fur, a long bushy tail tipped with white, and sharp amber eyes.", "Bramble froze mid-dig, his paws dusty with soil. “A fox!” he squeaked, scrambling halfway up the tree trunk."],
 ["The fox tilted her head, amused. “Relax, little squirrel. I only came to say hello.”", "Bramble’s ears twitched nervously. “Who... who are you?”", "“Fern,” the fox replied smoothly, giving her glossy coat a lick. “Fern the Fox. And you’re Bramble, if I’ve heard right. Word travels fast in the forest when someone starts running about talking of winter.”", "Bramble blinked. “You’ve heard of me?”", "“Of course,” Fern said with a grin. “Oakley mentioned you. He said you’re learning how to prepare for the cold.”"],
 ["Bramble crept down a little lower on the tree. He was curious, even though he was nervous. “Yes! I’ve been burying nuts and seeds. Tansley and Emsley showed me their stores, and Hazel taught me about hibernation. But I don’t think I could do what she does.”", "Fern laughed, a sound like wind slipping through tall grass. “I’d like to see a squirrel try to sleep through winter. You’d last a day before you started dreaming of hazelnuts.”"],
 ["Bramble blushed. “That’s probably true. But what about you? How do foxes get ready for winter? Do you store food? Or... sleep?”", "Fern stretched her long body and flicked her tail. “Neither. We foxes hunt all year round, even in the snow. When the nights grow long, food is harder to find. But we don’t hibernate, and we don’t stash food in neat piles like you do. We rely on our wits, our ears and our noses.”", "Bramble tilted his head. “So you just... keep looking? Even when the ground is frozen?”"],
 ["“That’s right,” Fern said proudly. “A fox can hear the tiniest rustle under the snow. When the forest is quiet, we listen. We wait. We pounce.” She pretended to leap, landing so lightly that the leaves barely rustled.", "Bramble clapped his paws. “That’s amazing!”", "Fern smiled. “It works well enough. Sometimes we find extra food and bury it to eat later. But mostly, we trust our skills. We take whatever chances we’re given.”", "Bramble thought hard. “That sounds... risky. What if you don’t find anything?”"],
 ["Fern’s amber eyes softened. “That happens sometimes. Winter is not easy, even for us. But foxes are clever. We sniff out scraps, raid berry bushes, and nibble beetles if we must. We get through because we adapt.”", "The word made Bramble’s whiskers twitch. Adapt. Oakley had said something similar: every animal had its own way. Hazel hibernated, Tansley and Emsley stored seeds, and Fern searched through the snow.", "“You’re not afraid of the cold, then?” he asked quietly.", "Fern chuckled. “I respect it, but I don’t fear it. Winter is a test. If I’m clever, I’ll eat. If I’m foolish, I’ll go hungry. It keeps me sharp.”"],
 ["Bramble nodded slowly. “I don’t think I could live like that. I’d panic if I didn’t know where my next nut was coming from.”", "“Exactly,” Fern said kindly. “Which is why you do what you do best. You bury food in clever places. That is your gift.” She leaned closer, her warm breath puffing against his fur. “Never forget, being prepared doesn’t always mean doing what others do. It means knowing yourself, and trusting your own way.”", "Bramble’s chest swelled with pride. “So... I’m not silly for spending all day gathering nuts?”"],
 ["“Not at all,” Fern said. “In fact, I wish I were more like you. My food depends on luck. Yours depends on how hard you work now. If you’re clever, you’ll never go hungry.”", "For the first time, Bramble felt proud of his nut-hoarding habit. He scampered down to show Fern one of his hiding spots: a hollow in a tree root, filled with shiny brown hazelnuts.", "Fern sniffed it politely. “Well hidden,” she said. “Though I’d suggest spreading them out a bit more. If another squirrel or a bird finds this, you’ll lose the whole stash.”"],
 ["“Oh!” Bramble gasped. “I hadn’t thought of that.”", "Fern winked. “Spread your chances, little squirrel. That’s what I do. Many hiding places, many chances. Then winter can’t surprise you.”", "Bramble grinned. “Thank you, Fern! I’ll do that. I’ll make lots of stashes in different places.”", "“That’s the spirit,” Fern said, turning back towards the meadow. “Now, I’ve spent enough daylight chatting. There are berry bushes out there with my name on them.”"],
 ["Bramble laughed. “Good luck!”", "Fern glanced back once, her amber eyes glinting. “Remember, Bramble: cleverness comes in many forms. Find yours.”", "With a graceful leap, she vanished into the tall grass, leaving Bramble buzzing with new ideas.", "He scampered back to his oak, tail flicking happily. He would bury more nuts, yes, but in cleverer ways. Under moss, behind rocks, inside hollow logs. He would not just gather. He would outsmart winter."],
 ["@Chapter 5: The Builders by the River", "The air smelled different near the river. Bramble padded carefully along the bank, his paws crunching damp leaves. He’d never come this far before, but Oakley had said the river folk worked harder than anyone when autumn arrived. Bramble wanted to see for himself.", "The river shone like silver in the morning light, flowing swiftly past reeds and pebbly shores. Across the water, he spotted a great mound of sticks, mud and branches rising from the shallows. It looked like a floating woodpile, until something moved inside."],
 ["A flat tail slapped the surface with a crack! Bramble jumped back with a squeak. From the lodge popped a rounded brown head with small eyes and big orange teeth that glinted in the light.", "“Who’s on the bank?” called a deep, steady voice.", "Bramble gathered his courage. “It’s me, Bramble the squirrel. I’m learning how to prepare for winter.”", "The beaver’s eyes softened. “Ah, a student of the seasons! Then you’re welcome here. Come closer, little one. I am Rylee.”", "Bramble hopped nearer, curiosity tugging him forward. “What is that enormous pile? Is it... your home?”"],
 ["Rylee chuckled. “Indeed it is. This is my lodge, built from sticks, mud and reeds. Strong against storms, warm against the frost. My family and I live inside, safe and dry.”", "Bramble’s whiskers twitched. “It looks like so much work. Did you build it all yourself?”", "Rylee’s tail thumped the water proudly. “Not alone. Beavers work together. My family and I gather branches, drag them through the water, and weave them tight. Every season, we add more. The river tests us, so we must always repair and always improve.”", "Bramble’s eyes went wide. “You keep building even now, before winter?”"],
 ["“Oh yes,” Rylee said. “Winter brings ice. If our lodge is weak, the cold water creeps in. If the roof leaks, we shiver. So we thicken the walls, pack mud into the holes, and fill our pantry.”", "“Pantry?” Bramble perked up. “You keep food in there too?”", "Rylee nodded. “Branches. We nibble the bark all through the cold months. We keep piles of fresh sticks underwater, so even when the river freezes over, we can dive down and fetch our food.”", "Bramble gasped. “That’s brilliant! You never run out?”"],
 ["“Not if we plan wisely,” Rylee said with a toothy grin. “We don’t store seeds like you, or hunt like Fern. Our winter feast grows in the forest itself. We take what we need, and the trees sprout new shoots in spring.”", "Bramble sat on the bank, his tail curled around his paws. “It must take so much strength to drag all those logs. Don’t you ever get tired?”", "Rylee’s laugh rumbled like distant thunder. “Of course. But beavers believe in teamwork. Alone, I might fail. Together, we succeed. My little ones learn to chew and carry, and the grown-ups patch the holes. No paw is wasted.”"],
 ["Bramble thought of his stashes scattered across the woods. He worked alone, always darting here and there. He felt a small pang. How nice it must be to have a family lodge, with everyone preparing side by side.", "“You’re very lucky,” he murmured.", "Rylee looked at him kindly. “And so are you, little squirrel. Not everyone must build lodges or dams. Your strength is in your speed. You can race through the branches and hide your food where few can find it. Every creature prepares in the way it was made to.”", "Bramble brightened. “I suppose that’s true.”", "Just then, a young beaver popped its head out of the lodge, whiskers dripping with water. “Papa! We found another willow branch downstream!”"],
 ["“Well done!” Rylee called. “Drag it to the pile. And remember, angle the twigs so they lock tight!”", "The little beaver nodded and vanished again, splashing happily.", "Bramble smiled. “They work so hard, even when they’re little.”", "Rylee’s eyes twinkled. “They do, because they know it matters. Winter is not a season for being lazy. It is a season for being wise. Prepare now, live later.”", "The words sank deep into Bramble’s heart. Prepare now, live later.", "He stood up, brushing soil from his paws. “Thank you, Rylee. I think I understand better now. Winter isn’t just about gathering. It’s about being clever, strong and ready in your own way.”"],
 ["Rylee dipped his head. “You’ve learned well. Go, Bramble. Make your part of the forest safe for yourself. And when the snow falls, remember that by the river, the builders’ lodge will still stand.”", "Bramble waved his tail goodbye, then scampered back through the woods, carrying the beaver’s lesson with him. He didn’t just need to bury nuts. He needed to bury enough, in the right places, with clever thought. He would work hard, just as the beavers worked on their lodge.", "By the time Bramble reached his oak, the sun was sinking behind the hills. The sky glowed pink and gold, and the first stars were blinking awake.", "A soft whoosh of wings made him look up."],
 ["Oakley settled on the branch beside his nest. His round eyes shone in the dusk.", "“You have been busy, young Bramble,” the owl said. “The mice, the hedgehog, the fox and the beaver have all been talking about the curious little squirrel who asks so many questions.”", "Bramble’s ears turned pink. “I’ve learned so much, Oakley. But I still don’t feel ready.”", "“That is because your lessons are not finished,” Oakley said. He leaned closer, and his voice dropped to a whisper. “When the moon is full, the owls of the forest will meet in the tall spruce. It is called the Midnight Council. No squirrel has ever been invited.” He blinked slowly. “Until now.”"],
 ["Bramble’s mouth fell open. “Me? At night? With the owls?”", "“Rest well,” Oakley said, spreading his great wings. “You will need your courage.”", "And with a sweep of feathers, he was gone into the darkening sky.", "Bramble curled up in his nest, his heart thumping. Above the trees, the moon was growing rounder every night. Somewhere out there, the owls were waiting.", "And Bramble’s winter plan was only just beginning.", "!To be continued in Bramble Braves the Snow"]
],
/* Bramble Braves the Snow. Approved 13 Oct 2026. Story so far + 5 chapters, 43 screen pages, 18 pictures. */
"bramble-2": [
 ["@The story so far: Where We Left Bramble", "When the first frost came, Oakley the Owl told Bramble the red squirrel that winter waits for no one.", "So Bramble set out to learn. Tansley and Emsley, the field mice, showed him how to hide food in lots of secret places. Hazel the Hedgehog taught him to build warm nests of leaves and moss. Fern the Fox taught him to be clever and spread out his stashes. And Rylee the Beaver showed him that it is wise to prepare now, so you can live well later.", "Then, one golden evening, Oakley brought a surprise. The owls of the forest were holding their Midnight Council. And for the very first time, a squirrel was invited."],
 ["@Chapter 6: The Owls’ Midnight Council", "The forest was quieter at night than Bramble expected. The rustle of leaves had faded, the wind whispered low through the branches, and even the river seemed to hush its voice. Bramble clung to the trunk of a tall spruce, his eyes wide.", "He wasn’t used to being awake after sundown, but Oakley had told him: If you truly want to understand how the forest prepares for winter, you must also listen to those who rule the night."],
 ["Bramble had shivered at the thought. Night creatures! Sharp eyes, silent wings, calls that echoed like ghostly songs. Still, his curiosity tugged him onward. Now, perched on the spruce, he waited.", "From the darkness came a low, steady hoot. “Whooo... whooo goes there?”", "Bramble jumped. His tail puffed up like a bottlebrush. “It’s, it’s Bramble! Just Bramble the squirrel! Oakley invited me!”", "A shadow moved without a sound above him. Wide wings stretched, catching the faint moonlight. Then, with barely a whisper, a tawny owl landed on the branch beside him. Her dark eyes were careful and calm."],
 ["“Welcome, little one,” she said gently. “You are safe here. This is a council, a meeting of friends.”", "Bramble gulped. “A council?”", "The owl tilted her head. “Yes. When autumn deepens, the owls gather to share news of the forest. We talk about where to find food, when to move, and how to keep the forest in balance through the lean months. I am Sage, and I lead the council. And you, little squirrel, are a very unusual guest.”", "Bramble’s whiskers trembled. “I’m learning how everyone prepares for winter. I’ve spoken with Tansley, Emsley, Hazel, Fern and Rylee. Oakley thought I should hear from the owls too.”"],
 ["Sage’s eyes glowed. “Oakley is wise. Very well. Sit quietly, and listen.”", "With a soft beat of wings, other owls appeared, gliding in from the dark. Oakley settled on a branch just above Bramble and gave him a slow, proud blink. One owl, smaller and speckled, landed nearby. Another, pale as moonlight with a heart-shaped face, perched higher up. Soon, half a dozen owls surrounded Bramble, their round faces turned towards him like the moons of the forest."],
 ["Bramble tucked his paws close. He’d never felt so small.", "Sage lifted her beak. “Friends, the squirrel has come to learn. Let us share our ways.”", "The barn owl spoke first, her voice cool and clear. “I fly over the open meadow. In winter, the meadow is quiet and still. My soft feathers let me fly without a sound, and I listen for the smallest rustle in the grass. I rely on patience.”"],
 ["The speckled owl bobbed his head. “I keep close to the woods. My ears guide me, even sharper than my eyes. Winter is harder, yes, but I have learned where to search: fallen logs, frozen thickets, and quiet corners where others forget to look.”", "Another owl, small and bright-eyed, ruffled her feathers. “When I find more food than I need, I tuck it away in the branches or inside hollow trees. Later, when I am hungry, I find it again.”", "Bramble’s ears perked up. “That’s like what I do with nuts!”"],
 ["The owls chuckled softly, their laughter like rustling leaves.", "Sage spoke last. “We owls prepare by sharpening our skills, by knowing the land, and by listening. Some of us fly to new hunting grounds when food grows too scarce. Others stay, trusting in our patience. Each chooses a path, but all must be wise. Winter is hard on those who waste.”", "Bramble thought hard. “So... you don’t build or store much. You practise. You watch. You make good choices.”"],
 ["“Exactly,” Sage said. “Preparing is not always piling up or saving. Sometimes, it is learning, adapting and keeping balance.”", "Bramble’s heart thudded. Every animal seemed to teach him something new. Tansley and Emsley had taught him to stash food. Hazel had shown him the calm of hibernation. Fern used her wits. Rylee built with strength. And now, the owls whispered of patience and wisdom.", "He looked around at their glowing eyes. “It sounds like winter tests everyone, no matter how they live.”"],
 ["Sage’s gaze softened. “It does. Yet remember, Bramble: tests can be passed. The forest keeps going because each creature plays its part. When you bury acorns, you feed yourself, yes. But sometimes, the ones you forget grow into trees. That, too, is preparing. For the forest, and for the future.”", "Bramble’s chest swelled with pride. He hadn’t thought of that before. His work mattered not just to him, but to the whole wood.", "The owls shifted, wings rustling as the night deepened. Sage spread her broad feathers. “The council is ended. Go, young squirrel. Learn well. And when the snow falls, remember our lesson: patience, wisdom and balance.”"],
 ["One by one, the owls lifted into the sky, their wings carrying them like shadows across the moon. Oakley was the last to go, dipping one wing to Bramble as he passed. Soon, only Sage remained. She leaned close. “Do not fear the night, Bramble. Even the darkness has its guardians.”", "Then she, too, was gone.", "Bramble sat in awe, his fur tingling with excitement. He had been afraid of the owls, yet they had welcomed him. They had taught him something he would never forget: preparing for winter wasn’t only about food or shelter. It was about knowing how to live wisely through the hardest days.", "He scampered down the spruce, heart racing. His winter plan was growing, piece by piece, with every lesson he learned."],
 ["@Chapter 7: Badger’s Underground Secrets", "The next morning, Bramble scampered further than ever before. The forest floor dipped into a hollow where the air smelled of damp earth and moss. The ground here was full of tunnels, small mounds of soil, and worn paths that curved beneath tangled roots.", "Bramble slowed down. He’d heard stories of the creature who lived here. Powerful and broad-shouldered, with claws strong enough to carve through the earth. Some animals whispered warnings: Don’t upset the badger.", "Still, Bramble had promised himself he’d learn from everyone. He gulped, twitched his whiskers, and called softly, “Hello? My name’s Bramble. I’m learning how to get ready for winter. Is anyone... home?”"],
 ["For a long moment, nothing stirred. Then the ground shifted. Soil crumbled. Up from a tunnel came a sturdy black-and-white head with a long snout and small dark eyes.", "“Well, well,” the badger rumbled. “A squirrel visitor. That’s not common.”", "Bramble’s tail twitched nervously. “I hope it’s not rude. I only wanted to ask... how do you prepare for winter?”", "The badger heaved himself out of the tunnel. His body was thick, his striped fur sleek, his claws curved and strong. “The name’s Bracken,” he said. “And winter, little squirrel, is serious business. Come inside. You’ll see.”"],
 ["Bramble hesitated for only a moment before following Bracken into the tunnel. It was cool and dark, but surprisingly roomy. Chambers branched off like little rooms, their floors padded with dry grass and moss. The walls smelled rich with earth.", "“Welcome to my sett,” Bracken said proudly. “Dug by my family and cared for over many, many years. Some tunnels are older than the oak trees above.”", "Bramble’s eyes widened. “You live underground all the time?”", "Bracken nodded. “Aye. Warm in winter, cool in summer. When the frost grips the world above, I sleep down here in comfort.”"],
 ["“Sleep? Like hibernating?” Bramble asked, remembering Hazel.", "“Not quite,” Bracken explained. “Badgers sleep deeply in the coldest spells, sometimes for days. But we wake up when the weather softens, look for food, and then curl up again. It’s more like... long naps.”", "Bramble tilted his head. “So you don’t gather food ahead of time?”", "Bracken grunted. “We eat well in autumn, and fatten up while the earth still gives us worms, berries and roots. Then our bodies carry us through the leanest days. I also line the chambers with straw and moss, so my family stays warm. A good sett is half the battle.”"],
 ["Bramble brushed a paw against the mossy bedding. It was soft, almost like feathers. “It’s so cosy!”", "Bracken’s eyes twinkled. “Aye. Comfort matters. Winter bites hard, but down here, the cold barely touches us. My cubs curl up close, and the earth keeps us safe.”", "Bramble thought of his nest high in the oak. It swayed in the wind, its thin twigs rattling. Compared to this sturdy underground home, his leafy nest felt fragile. “Do you ever worry about storms or snow?”", "“Not underground,” Bracken said simply. “That is the secret of the badger. Dig deep, stay hidden, and wait it out.”", "Bramble thought about this. “That’s clever. You don’t fight winter. You keep out of its way.”"],
 ["“Exactly,” Bracken said with a satisfied grunt. “Every creature must find its shield. Mine is the earth.”", "He nosed through a side chamber where dried bracken leaves were heaped. “There’s more. We badgers like company. My family shares the tunnels, takes turns watching the young ones, and keeps each other warm. Alone, a badger might struggle. Together, we do well.”", "Bramble’s whiskers twitched. “Rylee said something like that, too. His family builds their lodge together.”", "Bracken gave a slow nod. “The forest is full of lessons. Remember them.”", "Bramble looked around the sett with shining eyes. “Thank you, Bracken. You’ve shown me something new. Maybe I can line my nest with moss, too. It would make it much warmer.”"],
 ["The badger chuckled. “Now that’s thinking like a badger. Use what you learn. Take a little from each of us, and you’ll be ready when the snow comes.”", "Bramble’s chest swelled. Each animal had given him a gift: ideas, wisdom and new ways of doing things. His winter plan was growing stronger with every step.", "He scampered back towards the tunnel entrance, then paused. “Bracken? One more question. Do you ever feel afraid when winter is coming?”", "The badger’s eyes softened. “Of course. Even the strongest do. But fear is only a signal. It tells us to prepare. And if you’ve prepared, you have nothing to fear.”", "Bramble carried those words with him as he climbed back into the sunlight."],
 ["@Chapter 8: The Deer’s Autumn Feast", "The forest smelled sweet with fallen apples and damp leaves as Bramble hopped along the woodland path. Morning sunlight streamed through the bare branches, lighting up the mossy floor. Today, he was visiting a different kind of creature: the deer family who grazed in the open meadows at the edge of the forest.", "Bramble paused at the edge of the trees. Through the gaps, he could see them. Slender bodies, thick grey-brown winter coats, and large gentle eyes that seemed to notice everything."],
 ["“Hello?” Bramble called softly.", "In the meadow, a tall doe lifted her head. Her ears flicked as she sniffed the crisp air. “Hello, little one. Who are you?”", "“I’m Bramble,” he said, stepping forward. “I’m learning how everyone prepares for winter. Can you tell me what you do?”", "The doe tilted her head and smiled. “Of course. I am Willow, and I lead this herd. Follow me.”", "Bramble hopped after her as she led him to a clearing where the grass had been nibbled short, and acorns and fallen fruit lay scattered on the ground. A few fawns pranced nearby, nibbling tender shoots."],
 ["“We do not hibernate or stash nuts,” Willow said as she moved gracefully among her family. “We prepare by eating everything the forest gives us, and storing the energy in our bodies for the cold months.”", "Bramble’s eyes widened. “You just... eat?”", "“Yes,” Willow said gently. “Autumn is a time to feast. Roots, berries, fallen apples and tender shoots. Our bodies must grow strong. In winter, the snow covers most of our food. We get through because we filled our bellies and made our legs and hearts strong.”"],
 ["One fawn bounded over and nudged Bramble with a soft nose. “Hello!” it said. “You’re funny. Small and quick!”", "Bramble laughed. “And you’re soft and bouncy! How do you know where to find food?”", "Willow lowered her head to nuzzle the fawn. “We watch the forest. We remember the spots where fruit grows, where grass is tender, and where the acorns fall thickly. Autumn teaches us patterns. Winter tests them.”", "Bramble twitched his whiskers. “Patterns?”"],
 ["“Yes,” Willow said. “The forest changes. The trees drop their leaves, frost covers the ground, and the rivers slow down. We must adapt every day. Some winters are mild, and some are harsh. If we move carefully, listen and learn, we will be fine.”", "A stag stepped into the clearing, his antlers tall and impressive. He sniffed the air. “We also teach our young,” he said. “They learn to spot danger, to find food, and to stay together. A deer alone is easily frightened. Together, we are strong.”", "Bramble watched the family grazing. They moved as one, each step careful, ears flicking, eyes alert. Unlike the busy squirrel, the clever fox or the patient badger, the deer relied on each other."],
 ["“This is so different,” Bramble murmured. “Everyone has their own way.”", "“Yes,” Willow said kindly. “Watch, and you will learn. Collect nuts, build nests, dig tunnels, hibernate, listen in the dark... and sometimes, simply grow strong in your own body. Each way fits the animal.”", "Bramble sat by a pile of fallen acorns, watching the fawns nibble. “It must take a lot of energy to move about all day, even in winter.”", "The stag nodded. “It does. That is why we prepare in autumn. Our bellies full, our senses sharp, our muscles strong. Winter challenges us, but we endure.”"],
 ["Bramble’s tail twitched thoughtfully. He had collected, watched, listened and learned. He had seen the mice stock seeds, Hazel settle down to hibernate, Fern think cleverly, Rylee build, the owls watch, and Bracken sleep safely underground. And now, the deer reminded him that some animals prepare simply by making themselves strong.", "He sat quietly, feeling the warm, calm energy of the herd around him. Every animal had its lesson, and every lesson mattered. He had more ideas for his winter plan than ever before."],
 ["As the sun sank lower, casting a golden glow across the meadow, Willow nudged Bramble gently. “Remember, little squirrel, winter is long, but it is not meant to frighten you. Prepare in the way that suits you best. Then enjoy the forest in every season.”", "Bramble beamed. “Thank you, Willow. I’ll remember. I understand so much more now.”", "The deer grazed on, quiet and steady, as Bramble scampered back towards the forest. His mind buzzed with plans: more hiding places, warmer nests, extra energy and clever tricks. His winter plan was taking shape, stronger and more complete with every lesson learned."],
 ["@Chapter 9: Stormy Lessons", "The first snowflakes of winter fell softly while Bramble was busy checking his nut stashes. Tiny white flakes drifted down, settling on branches and leaves, turning the forest into a quiet, sparkling world. Bramble twitched his nose. It was beautiful, but also a little frightening.", "“I hope I’m ready,” he whispered to himself, his tail flicking nervously."],
 ["The wind picked up, whistling through the bare oak trees. Bramble shivered, remembering Hazel’s snug nests, Bracken’s warm underground sett and Rylee’s sturdy lodge. His own tree nest felt fragile compared to all of them. Still, he had worked hard. He had hidden nuts in dozens of clever places, lined his nest with moss, and built a small backup nest in a nearby hollow.", "Suddenly, a gust of wind swept down the branch, rattling the nuts in his paws. Bramble clutched them tightly, but a few tumbled to the forest floor with a soft plop. Panic rose in his chest. “Oh no! What if the snow keeps falling and I can’t find them?”", "A familiar voice called from below. “Calm down, Bramble!”"],
 ["It was Tansley, his little mouse friend, with Emsley close behind. “The storm’s only just starting,” Tansley said. “Don’t worry. You’ve hidden them in lots of places, haven’t you?”", "“Yes... yes, but...” Bramble’s whiskers twitched. “I’m scared I won’t reach them all in time!”", "“Then take it slowly,” Emsley said, scrambling onto a low branch. “We can help each other. We know where some of your nuts are, and we can mark safe paths.”", "Bramble’s ears perked up. “Really? You’d help me?”", "“Of course!” said Tansley. “Friends stick together, especially in winter.”"],
 ["Just then, another gust blew even stronger, and snow swirled through the forest like tiny dancers. Bramble felt a chill run down his spine. He thought of Hazel, curled up fast asleep in her leafy nest, safe until spring. He took a deep breath and remembered the lessons of every friend he’d met. Adapt. Be clever. Use what you’ve learned.", "Bracken the badger appeared next, snuffling through the snow with a steady calm. He had woken from one of his long naps to check on the forest. “Wind, snow, frost. It is all part of the challenge,” he rumbled. “But you’ve prepared, little squirrel. Your stashes are smart, and your nests are strong. Trust yourself.”"],
 ["Bramble nodded. “I will try.”", "As the snow thickened, Bramble, Tansley and Emsley set off to check the stashes. The flakes grew heavier, clinging to the branches and turning the forest floor into a sparkling white blanket. Bramble scurried from one hiding place to another, sniffing out each one with his clever nose, even under the snow. He dug out his nuts and checked them. Everything was safe, except for one small stash tucked under a pile of leaves. The snow had buried it deep.", "“Oh no!” Bramble gasped.", "Tansley hopped up beside him. “It’s all right! We can uncover it together. Dig carefully.”"],
 ["The three friends worked side by side, brushing snow from the leaves and twigs. Emsley’s tiny paws were surprisingly quick, and Tansley darted in to uncover hidden nuts faster than Bramble could have imagined.", "After a few tense minutes, the stash was safe, and Bramble’s chest filled with relief. “Thank you both! I couldn’t have done it alone.”", "Emsley grinned. “Winter is much less scary when friends lend a paw.”", "Suddenly, a shadow darted past. It was a fox moving through the snow, but it wasn’t Fern. This fox was a stranger, thin and hungry, with one torn ear and a sharp, sniffing nose. It was heading straight for Bramble’s biggest stash."],
 ["Bramble froze. Then he remembered Fern’s advice: be clever. Quickly, he dropped a trail of sticks and a few acorns leading away from his hiding places and off into the trees. The stranger fox sniffed, followed the trail for a moment, and then disappeared into the forest.", "Bramble let out a long breath. “That... worked!”", "“Yes!” Tansley cheered. “See? You’ve learned well. Clever hiding, careful thinking and quick action. You’re ready for winter.”"],
 ["The snowstorm carried on through the night, but Bramble’s heart felt warmer than ever. He had faced the first challenge and come through it. He had checked every stash, made his nests safe, and even protected his food from a hungry stranger. Most importantly, he had remembered the lessons of every forest friend: planning from Tansley and Emsley, patience from the owls, cleverness from Fern, preparation from Hazel and Rylee, strength from the deer, and safety from Bracken.", "When the storm finally eased, Bramble climbed back into his nest, pulling moss around him like a blanket. He looked out over the snow-covered branches, glittering in the pale moonlight."],
 ["“I’m ready,” he whispered to himself. “I’ve done everything I can. Winter won’t scare me any more.”", "And all around the forest, the other creatures were ready too. Tansley and Emsley were snug in their hollow log with their seeds, Hazel slept under her leaves, Fern padded cleverly through the snow, Rylee’s lodge stood sturdy by the river, Bracken rested safe in his sett, and the deer huddled patiently together. Each had prepared in their own way, just as Bramble had.", "The forest was alive with quiet strength, and Bramble knew he was now a part of it."],
 ["@Chapter 10: Bramble’s Winter Victory", "The forest had turned into a sparkling winter wonderland. Snow clung to the branches, blanketed the ground, and covered the hidden stashes Bramble had worked so hard to make. The chill in the air made his whiskers twitch, but Bramble’s heart felt warm. He had prepared.", "He scampered up to his moss-lined nest and peeked inside. Everything was exactly as he had left it: soft, cosy and safe. He looked around the tree trunk and down at the forest floor. Every nut he had buried, in every careful hiding spot, was safe beneath the snow. Relief and pride bubbled up inside him.", "“Phew,” Bramble murmured, tucking a hazelnut close. “I think I really did it.”"],
 ["Across the snowy meadow, Tansley and Emsley came bounding over, chattering excitedly. “Bramble! Your stashes are perfect! You’ve hidden them so cleverly, just like we practised.”", "Bramble grinned. “I couldn’t have done it without you two. You taught me how to store food carefully and plan ahead, and it made all the difference.”", "Then Bramble crept quietly to a tangle of brambles and peeped inside. There was Hazel, curled up in a round, prickly ball, snoring softly in her nest of leaves and moss. Bramble smiled and tiptoed away. He didn’t want to wake her. Hazel had taught him that winter isn’t only about storing food. It’s also about resting, and trusting your body when it needs to sleep. Even a busy squirrel needed rest to face the long, cold months ahead."],
 ["A flash of red fur appeared among the trees. Fern the fox paused beside him, her amber eyes gleaming. “Clever hiding and quick thinking. Very impressive,” she said. “I heard how you sent that stranger off on a wild goose chase. Winter isn’t just about what you store. It’s about being ready to adapt and think fast when surprises appear. You’ve learned that well.”", "Near the frozen river, Rylee the beaver popped his head up through a gap in the ice beside his lodge. “Your nests and stashes are strong, Bramble,” he rumbled. “A safe home is just as important as food. And remember, working together and building carefully can make all the difference between warm and cold.”"],
 ["Bramble smiled. He remembered watching Rylee’s family work on their lodge, and how much strength it had taken to drag the sticks and pack the mud. He realised he could make his own nest even sturdier by borrowing a few of Rylee’s tricks.", "A low rumble sounded from the ground as Bracken the badger poked his head out of his sett. “All is safe,” he said in his deep, steady voice. “Safety comes from preparing. A cosy, well-lined nest can keep you warm when the wind bites. You’ve thought ahead, little squirrel, and that matters most.”"],
 ["Bramble’s eyes shone. Each friend had taught him something special. Tansley and Emsley had shown him how to plan and store. Hazel had taught him to rest. Fern had taught him clever thinking. Rylee had taught him about teamwork and strong shelters. And Bracken had shown him how preparing keeps you safe.", "Above him, Sage the owl perched quietly on a branch, her dark eyes calm and wise. “Watching, patience and balance guide those who keep watch at night,” she said. “You have learned from every part of the forest, Bramble. Each lesson is a piece of the whole.”", "In the distant meadow, the deer pawed gently through the snow to find the grass beneath. Willow and her family moved together with quiet energy, reminding Bramble of the strength that comes from standing together and a body made ready."],
 ["Bramble gazed across the snowy forest, the lessons of every creature swirling together in his mind. His nests were safe, his stashes secure, and his body ready. But more than that, he carried the wisdom of the forest itself: to plan, to rest, to think cleverly, to work with others, to be safe, to watch, and to move with strength and balance.", "As the sky turned dusky blue, a soft whoosh of wings made him look up. Oakley settled on the branch beside him, just as he had on that very first frosty morning.", "“Winter waits for no one,” the old owl said, his round eyes twinkling. “But this year, young Bramble, you were waiting for winter.”", "Bramble laughed and puffed out his chest. “I watched, I learned, and I prepared. Just like you said.”"],
 ["“You did,” Oakley said warmly. “And you made a whole forest full of friends along the way.”", "Bramble climbed into his moss-lined nest and curled his tail around himself. Snowflakes drifted past the branches, sparkling in the moonlight, but inside, Bramble felt warm and peaceful. The wind howled and the snow kept falling, but he knew he was ready.", "“Thank you, everyone,” Bramble whispered softly. “Tansley and Emsley, Hazel, Fern, Rylee, Bracken, Willow, Sage and Oakley. I’m ready for winter now.”", "Outside, the forest rested and watched, each creature prepared in its own way. The owls alert. The fox clever. The mice snug in their hollow log. The beavers cosy in their lodge. The badger safe underground. The hedgehog fast asleep. The deer strong and together. And the little squirrel, snug in his cosy nest, carrying all their lessons in his heart."],
 ["For the first time, Bramble understood completely. Winter was not something to fear. It was a challenge to face, a season to honour, and a time to be clever, strong and prepared, with friends and wisdom to guide the way.", "And as he drifted into a peaceful sleep, the forest seemed to whisper its approval, the snowflakes twinkling like stars in the night.", "#The End"]
],
/* Eri and the Magic Book. Text approved by Tania on 3 Oct 2026, book approved 8 Oct 2026. A chapter book: 6 chapters, 32 screen pages, 19 pictures.
   "@" = chapter heading, "" = a small space between groups of lines. Which picture goes with which page is in picMap on the story card. */
eri: [
 ["@Chapter 1: Stickers and Stories", "Eri was eight years old, and she loved books.", "She read at breakfast.", "She read in the car.", "She even read in the bath. But only once.", "", "Her little sister, Marie, was five.", "Marie loved two things.", "Stickers and snacks."],
 ["Marie could not read yet.", "But she could stick.", "She stuck a star on the fridge.", "She stuck a frog on Dad’s shoe.", "She stuck a bunny on Eri’s book."],
 ["“Marie! Not on my book!” said Eri.", "“Sorry,” said Marie.", "She did not look very sorry.", "", "“Library day!” called Mum.", "“Yay!” said Eri.", "“Can I get a book about bunnies?” asked Marie.", "“You can’t read,” said Eri.", "Marie looked down at her shoes.", "", "“She can’t read yet,” said Dad. “Yet is a little word, but it does a big job.”"],
 ["Marie put her stickers in one pocket.", "She put two biscuits in the other.", "“Just in case,” she said.", "", "The library was big and quiet.", "It smelled of paper and polish.", "", "“Quiet voices,” said Mum.", "“Walking feet,” said Dad.", "“And stay together, you two,” said Mum.", "", "Mum and Dad sat down in the big soft chairs.", "The children’s corner was right beside them."],
 ["Eri ran her finger along the bottom shelf.", "Bump, bump, bump.", "Then she stopped.", "", "There was a small red book.", "It had no name on the front.", "It had no name on the back.", "And it was warm, like toast.", "", "Eri opened it.", "The pages were empty.", "“That is a boring book,” said Marie."],
 ["Then a thin black line wiggled across the page.", "It drew a shelf.", "It drew a chair.", "It drew a tiny bunny.", "", "“It’s a map!” whispered Eri. “A map of our library!”", "Marie pointed at the tiny bunny.", "“That’s the bunny shelf,” she said. “I know where that is.”", "", "Under the map, words began to grow.", "Eri read them out, one by one.", "“Children only. Knock three times.”"],
 ["@Chapter 2: The Little Red Door", "Marie led the way.", "She used her walking feet. It was not easy.", "", "The bunny shelf stood at the far end of the children’s corner.", "Eri pulled out one bunny book.", "Then another.", "", "^CLICK!", "", "The shelf swung open like a gate.", "Behind it was a little red door.", "It was just as tall as Marie, and no taller.", "It had a round gold handle."],
 ["“A grown-up would have to crawl,” said Eri.", "“A grown-up would get stuck,” said Marie.", "", "Eri looked back.", "Mum was reading.", "Dad was reading.", "The big library clock said ten o’clock.", "", "Eri’s tummy felt fizzy.", "“Stay together,” she said.", "She held out her hand, and Marie took it.", "", "Knock. Knock. Knock."],
 ["The little red door swung open.", "", "Inside was a round room, glowing with golden lanterns.", "Books went up and up, all the way to the ceiling.", "In the middle stood a chair shaped like a duck.", "", "On the chair sat a big grey cat.", "He wore tiny round glasses on the end of his nose.", "", "“Ah,” said the cat. “Readers. At last.”"],
 ["Eri and Marie jumped.", "“You can talk!” said Eri.", "“Of course I can talk,” said the cat. “I live in a library. I have had plenty of time to learn the words.”", "", "He bowed his furry head.", "“I am Sir Whiskers, Keeper of the Children’s Room.”"],
 ["“Why is it only for children?” asked Eri.", "“Grown-ups have the whole library,” said Sir Whiskers. “This room is yours.”", "He winked.", "“Besides, grown-ups never find the door. They look up high. Children look down low. All the best things are down low.”", "", "“Can we stay?” asked Marie.", "“You may,” said Sir Whiskers. “But first, you must answer three questions.”"],
 ["@Chapter 3: Three Questions", "Sir Whiskers cleaned his glasses on his tail.", "", "“Question one,” he said. “I have a spine, but no bones. I can take you far away, but I never move. What am I?”", "Eri’s hand shot up.", "“A book!” she said.", "“Correct,” said Sir Whiskers."],
 ["“Question two. I have no words at all, but I can tell you a whole story. What am I?”", "Eri thought.", "She thought some more.", "No words? Every story she knew was full of words.", "“I don’t know,” she said at last.", "Eri did not like not knowing."],
 ["Marie tugged her sleeve.", "“A picture,” said Marie. “A picture tells a story.”", "“Correct!” said Sir Whiskers.", "", "Eri stared at her little sister.", "“How did you know that?” she asked.", "“I read pictures all the time,” said Marie."],
 ["“Question three,” said Sir Whiskers. “This one is very important. What is round, and sweet, and lovely with a cup of tea?”", "“A biscuit!” shouted both girls.", "“That is not a riddle,” said Eri.", "“No,” said Sir Whiskers. “I am just hungry.”", "", "Marie reached into her pocket.", "She held out a biscuit. It was a bit squashed.", "Sir Whiskers ate it in two bites and purred like a little engine.", "", "“Now,” he said, licking his whiskers. “You may open the Magic Book.”"],
 ["@Chapter 4: The Giggle Page", "“Where is it?” asked Eri.", "She looked up at the tall shelves.", "“You are holding it,” said Sir Whiskers.", "", "Eri looked down.", "The little red book was glowing."],
 ["“The Magic Book chooses its own readers,” said Sir Whiskers. “Today, it chose you two.”", "", "Eri opened the book.", "Now there were words inside, curly and gold.", "She read them out loud.", "", "~“Giggle, wiggle, snort and squeak,", "~Tickle every nose and cheek!”"],
 ["^POOF!", "Glitter puffed into the air.", "", "^BOING!", "A big yellow rubber duck bounced past.", "", "A drawer slid open.", "Out marched a stripy sock.", "Then another.", "The socks began to dance."],
 ["Marie laughed until she got the hiccups.", "Eri laughed so hard she had to sit down on the floor.", "", "“Ah,” said Sir Whiskers happily. “The giggle page. My favourite.”", "", "^BOING!", "Another duck bounced by.", "", "^BOING! BOING!", "Then two more."],
 ["Now there were ten socks, dancing in a long, wiggly line.", "The glitter was up to their ankles.", "", "“That is enough now,” said Eri.", "But the magic did not stop.", "", "Eri shut the book.", "It sprang open."],
 ["She shut it again and sat on it.", "^FLUMP!", "It sprang open and tipped her onto the floor.", "", "“Sir Whiskers!” called Eri. “How do we make it stop?”", "", "But Sir Whiskers was laughing too hard to help.", "He rolled right off the duck chair.", "“Last page!” he squeaked. “Hee hee! Look at the last page!”"],
 ["Eri turned to the last page.", "Her tummy went cold.", "“There are no words,” she said. “It’s only a picture. I can’t read it!”", "", "A duck bounced off her head.", "^BOING!", "", "“I can,” said Marie."],
 ["@Chapter 5: The Gold Star", "Marie looked at the picture.", "She looked hard, the way she always looked at pictures.", "", "There was a red book.", "The book was shut.", "And on its cover sat one gold star.", "", "“It wants a star,” said Marie. “A star to keep it shut.”", "", "She reached into her pocket.", "She peeled off her very best gold star.", "", "Eri shut the book and held it tight with both hands.", "Marie pressed the star onto the cover."],
 ["The book gave a small, happy sigh.", "", "The ducks sat down.", "The socks folded themselves into pairs.", "The glitter floated down like snow.", "", "Everything was still.", "", "“You did it,” said Eri. “You read the last page.”", "“But I can’t read,” said Marie.", "“Not yet,” said Eri. “Not words. But you read pictures better than anyone I know.”", "", "Marie stood up very tall."],
 ["Sir Whiskers climbed back onto the duck chair.", "He put his glasses straight.", "“One of you reads words,” he said. “One of you reads pictures. A good book needs both. That is why it chose the two of you.”", "", "Sir Whiskers pulled a book from the lowest shelf.", "There were bunnies on every page.", "“For our picture reader,” he said. “Borrow it. Bring it back next week.”", "Marie hugged it to her chest."],
 ["The girls squeezed onto the duck chair together.", "Eri read the words.", "Marie read the pictures.", "Sir Whiskers ate the second biscuit and listened with his eyes shut."],
 ["Then the lanterns began to dim.", "“Time to close the room,” said Sir Whiskers.", "", "“Can we come back?” asked Eri.", "“Whenever you like,” said Sir Whiskers. “Knock three times. And always come together.”"],
 ["“Can we bring Mum and Dad?” asked Marie.", "Sir Whiskers shook his head.", "“Tell them all about it,” he said. “But they will not find the door. This room is just for children. It always has been.”", "", "“And the Magic Book?” asked Eri.", "“Put it back on the bottom shelf,” said Sir Whiskers. “It will find you when it has a new page ready.”"],
 ["@Chapter 6: Glitter", "The little red door closed with a click.", "The bunny shelf swung back into place.", "", "The big library clock still said ten o’clock.", "Not one minute had gone by.", "", "Eri slid the little red book back onto the bottom shelf.", "Its gold star twinkled.", "", "Mum looked up from her book.", "“Did you find something good?” she asked."],
 ["“A secret room!” said Marie. “And a talking cat! And ducks! And dancing socks!”", "“It’s behind the bunny shelf,” said Eri.", "", "Dad got down on his hands and knees.", "He peered behind the bunny shelf.", "He saw a wall.", "“No door here,” he said, smiling. “But what a wonderful story, you two.”", "", "“Marie,” said Mum, “why is there glitter in your hair?”", "Eri and Marie looked at each other.", "They giggled."],
 ["That night, Marie climbed onto Eri’s bed with the bunny book.", "She stuck a bunny sticker on Eri’s pillow.", "This time, Eri did not mind at all.", "", "“You read the words,” said Marie. “I’ll read the pictures.”", "And that is just what they did."],
 ["“Next week,” whispered Eri, “we bring more biscuits.”", "“And more stickers,” said Marie.", "", "Far away, on the bottom shelf of the library, a little red book gave one tiny giggle.", "", "#The End"]
],
/* Benny the Bunny's Bold Leap. Text approved by Tania on 6 Oct 2026. One page per picture. */
benny: [
 ["Benny the bunny hid behind a big, green, leafy bush.","He was very shy.","He wanted to be as brave as the birds flying in the big blue sky.","He sighed a big, sad sigh."],
 ["Lila the ladybird landed on a leaf near Benny, smiling.","“What’s wrong, Benny?” she asked kindly.","Benny whispered, “I’m afraid of everything.”"],
 ["Lila smiled. “Being brave doesn’t mean you’re never scared,” she said.","“It’s about trying, even if you feel afraid!”"],
 ["Lila pointed to a gurgling stream.","“I’m afraid to cross the stream, but today I will try. Let’s cross!”","Benny hesitated."],
 ["He took a deep breath and hopped.","He made it! He couldn’t believe it.","It felt great! He’d been brave!"],
 ["As they continued their journey, they met their friend, Max the Mouse.","They came across a colourful flower garden with tall sunflowers and bright daisies."],
 ["Benny felt nervous, but he remembered that being brave didn’t mean you weren’t nervous, and he had his friends by his side.","Lila and Max encouraged him to take small steps through the garden.","They worked together as a team!"],
 ["They saw a dark cave ahead. It looked scary.","“I’m afraid,” whispered Benny.","Lila stayed close beside him, and they walked together slowly."],
 ["Soon, they saw the sunlight, and Benny knew the scary part was over!"],
